# Local development stack. `docker compose up` is half of the entire setup;
# `pnpm dev` is the other half. No cloud account is needed for either.
#
# Every image is pinned to an exact version on purpose — a backend that
# silently upgrades under you is a bad afternoon. (Phase 1 §1.2)

name: pe-platform

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pe_platform}
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Creates the `umami` database (ADR-006). Runs ONLY on a fresh volume —
      # see the script for the one-liner an existing checkout needs.
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-directus} -d ${POSTGRES_DB:-pe_platform}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP trap
      - '${MAILPIT_WEB_PORT:-8025}:8025' # web UI — read magic links here
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  directus:
    image: directus/directus:12.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - '${DIRECTUS_PORT:-8055}:8055'
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    environment:
      SECRET: ${DIRECTUS_SECRET:-local-development-secret-not-for-deployment}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-pe_platform}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-directus}

      # Bootstrap: the admin account and the server-side service token are created
      # from these on first boot, so setting up is a documented, repeatable step
      # rather than clicking through a wizard. (Phase 1 §1.3)
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-directus-local-admin}
      ADMIN_TOKEN: ${DIRECTUS_SERVICE_TOKEN:-local-development-service-token}

      # All outbound mail goes to the Mailpit trap. No credentials, no TLS —
      # it is a local catcher, not a relay.
      EMAIL_TRANSPORT: smtp
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@localhost}
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
      EMAIL_SMTP_SECURE: 'false'
      EMAIL_SMTP_IGNORE_TLS: 'true'

      # ─── File storage ───────────────────────────────────────────────────────
      # Editor uploads (Phase 4). The committed default is `local`, writing to
      # the directus_uploads volume — a fresh clone still needs no cloud
      # account (hard rule 2), and the S3 variables below are inert until `s3`
      # appears in STORAGE_LOCATIONS.
      #
      # Order matters. The FIRST location is where new uploads are written; the
      # rest stay readable. Each file records its location in
      # `directus_files.storage` at upload time and that value is never
      # rewritten, so `s3,local` moves new uploads to the bucket while
      # everything already uploaded keeps resolving. Dropping `local` from the
      # list breaks every file that was written before the switch.
      STORAGE_LOCATIONS: ${DIRECTUS_STORAGE_LOCATIONS:-local}

      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads

      # The assets bucket only — Directus editor uploads. NEVER the archive
      # bucket: Directus indexes and thumbnails what it owns, and the archive is
      # 30,000+ clips it must not touch. (Phase 3 §3.5.)
      #
      # No ACL is set on purpose. The bucket stays private with Block Public
      # Access on; Directus streams files out through /assets/<id>, so the app's
      # asset URLs are identical either side of this switch.
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${AWS_ASSETS_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET: ${AWS_ASSETS_SECRET_ACCESS_KEY:-}
      STORAGE_S3_BUCKET: ${AWS_ASSETS_BUCKET:-}
      STORAGE_S3_REGION: ${AWS_ASSETS_REGION:-eu-north-1}
      # Regional endpoint, not the global s3.amazonaws.com default: the global
      # one costs a redirect on every request and fails outright for buckets in
      # regions opened after 2019.
      STORAGE_S3_ENDPOINT: ${AWS_ASSETS_ENDPOINT:-s3.eu-north-1.amazonaws.com}
      # Optional key prefix. Empty — the default — puts objects at the bucket
      # root, which is right for a bucket dedicated to Directus. If you ever set
      # one, the IAM policy's Resource has to match it or every upload 403s, and
      # changing it after files exist orphans them.
      STORAGE_S3_ROOT: ${AWS_ASSETS_ROOT:-}

      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}

      # Quieter logs locally; raise to 'debug' when chasing something.
      LOG_LEVEL: ${DIRECTUS_LOG_LEVEL:-info}
    healthcheck:
      # /server/ping is the public liveness probe. Do NOT use /server/health — it is
      # permission-gated in Directus 12 and answers 403 unauthenticated, which reads
      # as "unhealthy" forever on a server that is in fact fine.
      # node is guaranteed present in this image; curl and wget are not.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8055/server/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # ─── Analytics (ADR-006) ─────────────────────────────────────────────────────
  # Traffic and key events, self-hosted, cookieless. Shares the Postgres above
  # but in its own database, so Directus never introspects these tables.
  #
  # Nothing here is load-bearing: if this container is down, or an ad blocker
  # eats the tracker, the site behaves identically. `useAnalytics()` is a no-op
  # when NUXT_PUBLIC_UMAMI_HOST is empty, which is its state in a fresh clone —
  # so a first `docker compose up` needs no analytics setup at all.
  umami:
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${UMAMI_PORT:-3001}:3000'
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-directus}:${POSTGRES_PASSWORD:-directus}@postgres:5432/${UMAMI_DB:-umami}

      # Salts the daily visitor hash. Rotating it makes returning visitors look
      # new, so it is set once per environment and left alone.
      APP_SECRET: ${UMAMI_APP_SECRET:-local-development-umami-secret}

      # Umami phones home with usage statistics by default. Off — a platform
      # that self-hosts analytics to avoid sending data to a third party should
      # not send data to a third party. (ADR-006)
      DISABLE_TELEMETRY: '1'

      # The tracker is served at the default /script.js on purpose. Umami can
      # rename it to slip past blocklists; doing that on a site whose whole
      # posture is "we do not track you" would be dishonest, and a blocked
      # tracker is a reader exercising a preference we said we respect.
    healthcheck:
      # node is guaranteed present in this image; curl and wget are not — same
      # reasoning as the Directus probe above.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/heartbeat').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  pg_data:
  directus_uploads:
  mailpit_data:
